name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default (OpenSSF Scorecard Token-Permissions): the test
# job only reads the repo. Jobs can widen this if they ever need to.
permissions:
  contents: read

jobs:
  test:
    name: Tests (pos-core + database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1

      # Node 24 runs the TypeScript test files directly (native type stripping),
      # matching local dev. `node --test` lives in packages/*/package.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
