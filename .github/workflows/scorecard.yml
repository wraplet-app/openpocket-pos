name: Scorecard supply-chain security

# OpenSSF Scorecard: automated checks of the repo's security posture
# (branch protection, dangerous workflows, pinned deps, token permissions, etc.).
# Results appear in the Security tab and are published to power the badge.
on:
  branch_protection_rule:
  schedule:
    - cron: '0 7 * * 1' # weekly, Mondays 07:00 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF results
      id-token: write        # publish results to the OpenSSF API (powers the badge)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: results.sarif
