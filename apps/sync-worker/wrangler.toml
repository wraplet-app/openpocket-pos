name = "openpocket-sync"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

# The D1 database. Create it with `pnpm db:create` (or `wrangler d1 create
# openpocket-production`), then paste the printed database_id below before
# deploying. Kept separate from the Milo databases on purpose.
[[d1_databases]]
binding = "DB"
database_name = "openpocket-production"
database_id = "15cc5723-14e8-4f1b-a59d-6a7c2d7a15ec"

[observability]
enabled = true
