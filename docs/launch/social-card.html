<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root { --a:#0e9d72; --a2:#14b884; --ink:#06120d; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  .card { width:1200px; height:630px; position:relative;
    background: radial-gradient(120% 120% at 82% 8%, #0c3a2b 0%, #06140f 55%, #050d0a 100%);
    font-family:"Instrument Sans",system-ui,sans-serif; color:#eaf3ee; display:flex; align-items:center; overflow:hidden; }
  .card::before { content:""; position:absolute; top:-160px; right:-120px; width:640px; height:640px;
    background: radial-gradient(circle, rgba(34,196,141,.36), transparent 60%); }
  .left { flex:1; padding:70px 0 70px 76px; position:relative; z-index:1; }
  .brand { display:flex; align-items:center; gap:14px; margin-bottom:34px; }
  .logo { width:52px; height:52px; border-radius:15px; background:linear-gradient(150deg,var(--a2),#0a7a58);
    display:grid; place-items:center; box-shadow:0 14px 30px -12px rgba(0,0,0,.6); }
  .logo svg { width:30px; height:30px; }
  .brand span { font-family:"Bricolage Grotesque"; font-weight:800; font-size:30px; letter-spacing:-.02em; }
  .eyebrow { color:#38e0a3; font-weight:600; font-size:17px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:16px; }
  h1 { font-family:"Bricolage Grotesque"; font-weight:800; font-size:66px; line-height:1.02; letter-spacing:-.03em; max-width:14ch; }
  h1 em { font-style:normal; color:#38e0a3; }
  .sub { color:#a9c0b6; font-size:23px; margin-top:22px; max-width:26ch; }
  .pills { display:flex; gap:12px; margin-top:34px; }
  .pill { border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:11px 20px; font-weight:600; font-size:18px; }
  .pill.hot { background:var(--a); border-color:var(--a); color:#04140d; }
  .url { position:absolute; left:76px; bottom:52px; color:#7fd8b6; font-weight:600; font-size:20px; }
  .right { width:470px; height:630px; position:relative; z-index:1; display:flex; align-items:center; justify-content:center; }
  .device { width:300px; border-radius:38px; padding:8px; background:linear-gradient(155deg,#2b332e,#050807);
    box-shadow:0 50px 90px -30px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.08); transform:rotate(4deg); }
  .device .screen { border-radius:31px; overflow:hidden; line-height:0; background:#000; }
  .device img { width:100%; }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 9.5 12 4l8 5.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5Z" fill="#fff"/><rect x="8.5" y="13" width="7" height="8" rx="1.2" fill="#0a7a58"/></svg></span>
        <span>OpenPocket POS</span>
      </div>
      <div class="eyebrow">Offline-first point of sale</div>
      <h1>Run your shop from <em>your pocket.</em></h1>
      <p class="sub">Sell, track stock and see your profit — from a phone. No account, no internet.</p>
      <div class="pills">
        <span class="pill hot">Free to sell, forever</span>
        <span class="pill">Cloud sync $2/mo</span>
        <span class="pill">Open source</span>
      </div>
      <div class="url">wraplet-app.github.io/openpocket-pos</div>
    </div>
    <div class="right">
      <div class="device"><div class="screen"><img src="../screenshots/01-home.png" alt=""></div></div>
    </div>
  </div>
</body>
</html>
